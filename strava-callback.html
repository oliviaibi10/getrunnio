<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conectando con Strava — Runnio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #181512;
  --accent: #FF5A2C;
  --sub: rgba(255,255,255,.55);
  --font: 'Hanken Grotesk', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 380px; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; margin-bottom: 28px; }
.logo em { font-style: normal; color: var(--accent); }
.spinner {
  width: 34px; height: 34px; margin: 0 auto 24px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
h1 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 10px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 800; font-size: 16px; padding: 15px 28px; border-radius: 16px; }
    p { font-size: 14.5px; color: var(--sub); line-height: 1.6; margin-bottom: 22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">runn<em>io</em></div>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Terminando de conectar Strava…</h1>
    <p id="subtitle">Volviendo a Runnio…</p>
    <a class="btn" id="open" href="#" style="display:none">Abrir Runnio</a>
  </div>
  <script>
    // Normalmente Runnio intercepta esta URL como enlace universal y esta página ni se ve. Si se
    // ve (p. ej. sin la app de Strava instalada la autorización va por Safari y la redirección
    // final no siempre abre la app), hay que devolverle a Runnio el "code" de Strava: sin él la
    // conexión NO se completa. Se hace por el esquema propio runnio:// (Runnio 1.6.1+).
    (function () {
      var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
      var t = en ? {
        title: 'Back to Runnio', sub: 'Tap the button to finish connecting Strava.',
        btn: 'Open Runnio', cancelTitle: 'Connection cancelled',
        cancelSub: 'You can connect Strava again from Runnio whenever you like.',
        update: 'If nothing happens, update Runnio from the App Store and connect again.'
      } : {
        title: 'Vuelve a Runnio', sub: 'Pulsa el botón para terminar de conectar Strava.',
        btn: 'Abrir Runnio', cancelTitle: 'Conexión cancelada',
        cancelSub: 'Puedes volver a conectar Strava desde Runnio cuando quieras.',
        update: 'Si no pasa nada, actualiza Runnio desde la App Store y vuelve a conectar.'
      };
      var params = new URLSearchParams(window.location.search);
      var appURL = 'runnio://strava-callback' + window.location.search;
      var btn = document.getElementById('open');
      btn.href = appURL;
      btn.textContent = t.btn;

      if (params.get('error')) {
        // El botón también avisa a la app, que muestra "Has cancelado la conexión".
        document.getElementById('title').textContent = t.cancelTitle;
        document.getElementById('subtitle').textContent = t.cancelSub;
        document.getElementById('spinner').style.display = 'none';
        btn.style.display = 'inline-block';
        return;
      }
      // Intento automático; Safari puede pedir confirmación ("¿Abrir en Runnio?").
      window.location.href = appURL;
      setTimeout(function () {
        document.getElementById('title').textContent = t.title;
        document.getElementById('subtitle').textContent = t.sub + ' ' + t.update;
        document.getElementById('spinner').style.display = 'none';
        btn.style.display = 'inline-block';
      }, 1500);
    })();
  </script>
</body>
</html>
